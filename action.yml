name: Publish to Hackage
description: Publish a Haskell package to Hackage

branding:
  icon: 'upload'
  color: 'magenta'

inputs:
  token:
    description: 'Authentication token for Hackage'
    required: true

  server:
    description: 'URL to the Hackage server'
    required: false
    default: 'https://hackage.haskell.org'

  publish:
    description: 'A flag indicating whether to publish the release on Hackage. Uploads a release candidate if set to false'
    required: false
    default: 'false'

  package-path:
    description: 'Path to the package tarball (e.g., produced by "cabal sdist")'
    required: true

  doc-path:
    description: 'Path to the package documentation tarball (e.g., produced by "cabal haddock --haddock-for-hackage"). Leave empty to skip documentation upload'
    required: false
    default: ''

outputs:
  already-published:
    description: '"true" if the package was already published on Hackage prior to this run (an idempotent no-op); "false" if this run performed the publish. Only meaningful when "publish" is "true" - candidate uploads always report "false"'
    value: ${{ steps.publish.outputs.already-published }}

runs:
  using: composite
  steps:

    - name: Publish package
      id: publish
      shell: bash
      env:
        HACKAGE_TOKEN: ${{ inputs.token }}
        HACKAGE_SERVER: ${{ inputs.server }}
        PUBLISH: ${{ inputs.publish }}
        PACKAGE_PATH: ${{ inputs.package-path }}
        DOC_PATH: ${{ inputs.doc-path }}
      run: ${{ github.action_path }}/scripts/publish.sh
